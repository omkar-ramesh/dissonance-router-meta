# Which Meta model serves each tier, in two profiles of the Meta Model API.
# Edit this file, restart the server, and the Models page shows the change. The Standard / Contributor
# switch in the app picks one of the two profiles. A value in .env (MODEL_NANO, PRICE_NANO_IN, ...) still wins.
#
#   model      the exact Meta Model API id (https://dev.meta.ai/docs/models)
#   effort     reasoning_effort: minimal, low, medium, high, xhigh or max. Muse Spark always reasons, so
#              "none" is rejected by the API; the router spends thinking only where the user is uncertain.
#   in, out    USD per 1M input / output tokens. cached: per 1M cached input tokens.
#              Reasoning tokens are billed as output.
#
# Standard mode: your content is not used to train Meta models.
# Contributor mode: your content may be used to train future Meta models, for a lower price.
# Muse Wonder has no Contributor mode, and Muse Spark 1.3 Contributor has no "max" effort.

default_mode = "standard"

[standard.nano]
model = "muse-spark-1.3"
effort = "minimal"
in = 1.25
out = 4.25
cached = 0.15

[standard.super]
model = "muse-spark-1.3"
effort = "medium"
in = 1.25
out = 4.25
cached = 0.15

[standard.ultra]
model = "muse-wonder-1.0"
effort = "high"
in = 4.00
out = 20.00
cached = 0.20

[contributor.nano]
model = "muse-spark-1.3-contributor"
effort = "minimal"
in = 0.10
out = 0.20
cached = 0.002

[contributor.super]
model = "muse-spark-1.3-contributor"
effort = "medium"
in = 0.10
out = 0.20
cached = 0.002

[contributor.ultra]
model = "muse-spark-1.3-contributor"
effort = "xhigh"
in = 0.10
out = 0.20
cached = 0.002
